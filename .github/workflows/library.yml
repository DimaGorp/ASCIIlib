name: Library.yml
on:
  workflow_call: 
jobs:
  build:
    name: Build Library
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - name: Building Library
        uses: ./.github/actions/Library/build
        with:
          build_type: Debug