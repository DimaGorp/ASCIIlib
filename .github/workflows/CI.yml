name: CI
on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  BuildWorkflow:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/Library/build
  
  TestWorkflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/Library/test