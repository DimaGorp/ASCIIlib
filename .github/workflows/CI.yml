name: CI
on:
  workflow_dispatch:
  push:
    branches:  
      - develop 
      - feature/**
  pull_request:
    branches: 
      - develop
defaults:
  run:
    shell: bash
    

jobs:
  build-library:
    uses: ./.github/workflows/library.yml
  test-library:
    needs: build-library
    uses: ./.github/workflows/test.yml