name: CI
on:
  workflow_dispatch:
  push:
    branches:  
      - develop 
      - feature/**
  pull_request:
    branches: 
      - develop
defaults:
  run:
    shell: bash
    

jobs:
  Preparing:
    name: Preparing dependencies
    strategy: 
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/Library/preparing
        id: prepare
      - run: echo "${{ steps.prepare.outputs.build-output-dir }}"
          
  Build:
    name: Build Library
    needs: Preparing
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
    
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - name: Debug prepare output
        run: |
          echo "Full needs object: ${{ toJson(needs) }}"
          echo "Preparing outputs: ${{ toJson(needs.Preparing.outputs) }}"
          echo "build-output-dir: ${{ needs.Preparing.outputs.build-output-dir }}"
        shell: bash
      - uses: ./.github/actions/Library/build
        with:
          build_type: ${{ matrix.build_type }}
          c_compiler: ${{ matrix.c_compiler }}
          cpp_compiler: ${{ matrix.cpp_compiler }}
          build_output_dir: ${{ needs.Preparing.outputs.build-output-dir }}
  
  Test:
    name: Test Library
    needs: [Preparing,Build]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/Library/test
        with:
          build_type: Release
          build_output_dir: ${{needs.Preparing.outputs.build-output-dir }}