name: CI
on:
  push:
    branches:
      - "*"
  workflow_call:

defaults:
  run:
    shell: bash
    

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Chekout a repo
        uses: actions/checkout@v4.2.2
      - name: Build lib
        uses: threeal/cmake-action@v2.1.0
        with:
          run-build: false
          source-dir: ${{github.workspace}}
          build-dir: ${{github.workspace}}/build
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Unit Tests Ran"
  collect-artifacts:
    needs: [build,test]
    runs-on: windows-latest
    steps:
      - name: Collect Artifacts
        run: |
          echo "Artifacts Collected"

          

      
