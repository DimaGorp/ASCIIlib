name: CI
run-name: Continuous Integration for Library
on:
  workflow_dispatch:
  push:
    branches:  
      - '!develop'
      - 'feature/**'
  pull_request:
    branches: 
      - 'develop'
      - '!feature/**'
defaults:
  run:
    shell: bash
    

jobs:
  build-library:
    uses: ./.github/workflows/library.yml
  test-library:
    needs: build-library
    uses: ./.github/workflows/test.yml