name: CI
on:
  push:
    branches:
      - "*"
  workflow_call:
env:
  branches:
    develop
    feature
    release
defaults:
  run:
    shell: bash
    

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Build lib
        run: |
          echo "Build"
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Unit Tests Ran"
  collect-artifacts:
    needs: [build,test]
    runs-on: windows-latest
    steps:
      - name: Collect Artifacts
        run: |
          echo "Artifacts Collected"
  deploy-staging:
    needs: collect-artifacts
    runs-on: windows-latest
    enviroment: Staging
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
      if: startsWith(github.ref, 'ref/head/release/') || contains(github.ref, '/tags/release')
      run: |
        echo "Stage"
  deploy-development:
    needs: collect-artifacts
    runs-on: windows-latest
    enviroment: Development
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
      if: !(startsWith(github.ref, 'ref/head/release/')) || !(contains(github.ref, '/tags/release')) || ${{github.ref != 'refs/heads/$default_branch'}}
      run: |
        echo "development"  
          

      
