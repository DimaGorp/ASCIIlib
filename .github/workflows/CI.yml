name: CI
on:
  push:
    branches:
      - "*"
  workflow_call:

defaults:
  run:
    shell: bash


jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{matrix.os}}
    steps:
      - name: Chekout a repo
        uses: actions/checkout@v4.2.2
      - name: Build lib
        uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          source-dir: ${{github.workspace}}
          build-dir: ${{github.workspace}}/build
          options: |
            BUILD_TESTS=ON
        #Cache for build
      - name: Cache a build
        uses: actions/cache/save@v6
        with:
          path: Build
          key: ${{runner.os}}-build

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Chekout a repo
        uses: actions/checkout@v4.2.2
      - name: Get build from Cache 
        uses: actions/cache/restore@v6
        with:
          path: Build
          key: ${{runner.os}}-build
      - name: Run Unit Tests
        run: |
          dir Build/test
        #uses: threeal/ctest-action@v1.1.0
        #with:
        #  test-dir: build/test

  collect-artifacts:
    needs: [build,test]
    runs-on: windows-latest
    steps:
      - name: Collect Artifacts
        run: |
          echo "Artifacts Collected"

          

      
