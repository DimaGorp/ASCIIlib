name: CI
on:
  push:
    branches: 
      - "*"
  workflow_call:
env:
  branches:
    develop
    feature
    release
defaults:
  run:
    shell: bash
    

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy a library
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Prod"
      - name: Deploy library(Staging)
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Stage"
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Unit Tests Ran" 
          

      
