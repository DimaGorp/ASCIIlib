name: CI
on:
  push:
    branches:
      - "*"
  workflow_call:

defaults:
  run:
    shell: bash
    

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Build lib
        run: |
          echo "Build"
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Unit Tests Ran"
  collect-artifacts:
    needs: [build,test]
    runs-on: windows-latest
    steps:
      - name: Collect Artifacts
        run: |
          echo "Artifacts Collected"
  deploy-staging:
    needs: collect-artifacts
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/release')
    runs-on: windows-latest
    environment: Staging
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
      run: |
        echo "Stage"
  deploy-development:
    needs: collect-artifacts
    if: startsWith(github.ref, 'ref/head/release/')!=true || contains(github.ref, '/tags/release')!=true || ${{github.ref != 'refs/heads/$default_branch'}}
    runs-on: windows-latest
    environment: Development
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
      run: |
        echo "development"  
          

      
