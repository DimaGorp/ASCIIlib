name: CD
on:
  push:
    branches: $default_branch

jobs:
  collect_binaries:
    uses: ./.github/workflows/CI.yml
  deploy-production:
    needs: collect_binaries
    runs-on: windows-latest
    enviroment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy a library
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Prod"
  deploy-staging:
    needs: collect_binaries
    runs-on: windows-latest
    enviroment: Staging
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
        if: ${{github.ref == refs/heads/release/*}}
        run: |
          echo "Stage"
  deploy-development:
    needs: collect_binaries
    runs-on: windows-latest
    enviroment: Development
    steps:
    - uses: actions/checkout@v4
    - name: Deploy library
        if: ${{github.ref != refs/heads/release/*}} ||  ${{github.ref != refs/heads/$default_branch}}
        run: |
          echo "development"