name: Building a Library
on:
  workflow_call:
  workflow_dispatch: 
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{matrix.os}}
    steps:
      - name: Build lib
        uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          source-dir: ${{github.workspace}}
          build-dir: ${{github.workspace}}/build
          options: |
            BUILD_TESTS=ON