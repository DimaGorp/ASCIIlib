name: 'Test'
description: 'Run tests'

inputs:
  build_type:
    description: 'Build type'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run tests
      shell: bash
      working-directory: "${{ steps.strings.outputs.build-output-dir }}"
      run: ctest --build-config "${{ inputs.build_type }}" --output-on-failure