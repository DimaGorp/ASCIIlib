name: preparing
description: preparing for building

outputs: 
  deps_folder:
    description: 'Dependencies folder'
    value: ${{ steps.save_deps_folder.outputs.deps_folder }}
  build_dir:
    description: 'Build Folder'
    value: ${{steps.strings.outputs.build_dir}}
runs:
  using: 'composite'
  steps:
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build_dir=$GITHUB_WORKSPACE/build" >> $GITHUB_OUTPUT
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        libx11-dev \
        libxrandr-dev \
        libxcursor-dev \
        libxi-dev \
        libgl1-mesa-dev \
        libglu1-mesa-dev \
        libudev-dev \
        xorg-dev
      if: runner.os == 'Linux'
    - id: save_deps_folder
      shell: bash
      run: echo "deps_folder=$GITHUB_WORKSPACE/deps" >> $GITHUB_OUTPUT
      if: runner.os == 'Linux'
    #- name: Cache dependencies
    #  uses: actions/cache@v4
    #  with:
    #    path: deps
    #    key: ${{runner.os}}-deps