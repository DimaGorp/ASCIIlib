name: preparing
description: preparing for building

outputs: 
  deps_folder:
    description: 'Dependencies folder'
    value: ${{ steps.save_deps_folder.outputs.deps_folder }}

runs:
  using: 'composite'
  steps:
    - name: Cache Linux dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/deps
        key: ${{runner.os}}-deps
        restore-keys: |
          ${{runner.os}}-deps
      if: runner.os == 'Linux'
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -o Dir::Etc::sourcelist="sources.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
        sudo apt-get install -y --no-install-recommends \
          libx11-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libudev-dev
    - id: save_deps_folder
      shell: bash
      run: echo "deps_folder=$GITHUB_WORKSPACE/deps" >> $GITHUB_OUTPUT
      if: runner.os == 'Linux'