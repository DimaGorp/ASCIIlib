name: 'Build'
description: 'Build the project'

inputs:
  build_type:
    description: 'Build type'
    required: true
  c_compiler:
    description: 'C compiler'
    required: true
  cpp_compiler:
    description: 'C++ compiler'
    required: true

runs:
  using: 'composite'
  steps:      
    - name: Configure CMake
      shell: bash
      run: >
        cmake -B "$GITHUB_OUTPUT"
        -DCMAKE_CXX_COMPILER="${{ inputs.cpp_compiler }}"
        -DCMAKE_C_COMPILER="${{ inputs.c_compiler }}"
        -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}"

    - name: Build
      shell: bash
      run: cmake --build "$GITHUB_OUTPUT" --config "${{ inputs.build_type }}"