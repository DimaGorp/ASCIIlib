name: 'Build'
description: 'Build the project'

inputs:
  build_type:
    description: 'Build type'
    required: true
  build_output_dir: 
    description: 'Build output directory'
    required: true
runs:
  using: 'composite'
  steps:   
    - name: Configure CMake
      shell: bash
      run: |
        sudo chown -R $USER:$USER ${{ github.workspace }}
        rm -rf ${{inputs.build_output_dir}}
        cmake -B '${{inputs.build_output_dir}}'
        -DCMAKE_BUILD_TYPE=${{inputs.build_type}}

    - name: Build
      shell: bash
      run: cmake --build "${{inputs.build_output_dir}}" --config "${{ inputs.build_type }}"