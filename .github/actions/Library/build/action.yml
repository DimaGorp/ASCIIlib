name: 'Build'
description: 'Build the project'

inputs:
  build_type:
    description: 'Build type'
    required: true
  c_compiler:
    description: 'C compiler'
    required: true
  cpp_compiler:
    description: 'C++ compiler'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Deps on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libasound2-dev libpulse-dev
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      
    - name: Configure CMake
      shell: bash
      run: >
        cmake -B "${{ steps.strings.outputs.build-output-dir }}"
        -DCMAKE_CXX_COMPILER="${{ inputs.cpp_compiler }}"
        -DCMAKE_C_COMPILER="${{ inputs.c_compiler }}"
        -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}"
        -S "${{ github.workspace }}"

    - name: Build
      shell: bash
      run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config "${{ inputs.build_type }}"