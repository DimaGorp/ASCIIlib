name: 'Build'
description: 'Build the project'

inputs:
  build_type:
    description: 'Build type'
    required: true
runs:
  using: 'composite'
  steps:   
    - name: Configure CMake
      shell: bash
      run: |
        cd "${{ github.workspace }}"
        sudo rm -rf build
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{inputs.build_type}}

    - name: Build
      shell: bash
      run: cmake --build build --config "${{ inputs.build_type }}"